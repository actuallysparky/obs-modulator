# SPDX-License-Identifier: GPL-2.0-or-later
name: Flatpak preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test corresponding-source packaging
        run: python3 tests/test-packaging.py
      - name: Install Flatpak tooling
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends flatpak flatpak-builder dbus-x11 xvfb xauth
      - name: Build extension, run core tests and smoke-load in OBS Flatpak
        run: dbus-run-session -- bash ci/flatpak-build.sh
      - name: Retain extension, matching source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-x86_64-preview
          path: dist/
          retention-days: 14
          if-no-files-found: error
